[pytest]
testpaths = tests

# 让项目根目录进入 import 路径，用例可直接 `from api.client import ApiClient`
pythonpath = .

# 基础配置保持最小，保证「装完依赖直接 pytest」即可通过；
# allure / reruns / xdist 等增强参数在需要时显式追加（CI 中已启用），见 README。
addopts = -v --strict-markers

markers =
    smoke: 冒烟用例，覆盖核心链路，CI 每次必跑

# 统一命名规范
python_files = test_*.py
python_classes = Test*
python_functions = test_*
