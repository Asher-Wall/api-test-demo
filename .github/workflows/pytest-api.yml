name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新提交会取消上一次仍在跑的流水线，避免排队浪费
concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行接口自动化用例
        run: pytest --alluredir=allure-results --reruns 2 -n auto

      - name: 上传 Allure 原始数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-py${{ matrix.python-version }}
          path: allure-results
          retention-days: 7
